# Example Apache virtual host for the merged app (Laravel API + built
# React/Vite frontend served from the same public/ folder).
# Place this in /etc/apache2/sites-available/id-card-unit.conf
# (Ubuntu/Debian) and enable with: a2ensite id-card-unit && systemctl reload apache2
#
# Requires: mod_rewrite, mod_headers, PHP 8.2+ via mod_php or PHP-FPM.
# Run ../build-frontend.sh (or `npm run build` in /frontend) at least once
# before starting Apache, so public/index.html + assets/ exist.

<VirtualHost *:80>
    ServerName your-domain.example

    # Apache's default 60s Timeout can cut off slow proxied/PHP-FPM requests;
    # keep it at a minimum of 5 minutes to match the app's own HTTP client timeouts.
    Timeout 300

    # backend/public is the ONE document root for both the SPA and the API.
    DocumentRoot /var/www/id-card-unit-app/backend/public

    <Directory /var/www/id-card-unit-app/backend/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # If using PHP-FPM instead of mod_php, uncomment and adjust the socket path:
    # <FilesMatch \.php$>
    #     SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost"
    # </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/id-card-unit-error.log
    CustomLog ${APACHE_LOG_DIR}/id-card-unit-access.log combined
</VirtualHost>

# For HTTPS, terminate TLS here (or in a reverse proxy in front of Apache)
# and set APP_URL in .env to the https:// address.
