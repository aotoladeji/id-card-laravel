# Example Nginx server block for the merged app (Laravel API + built
# React/Vite frontend served from the same public/ folder), behind PHP-FPM.
# Place this in /etc/nginx/sites-available/id-card-unit and enable with:
#   ln -s /etc/nginx/sites-available/id-card-unit /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Requires: PHP-FPM 8.2+ (adjust the fastcgi_pass socket/path below).
# Run ../build-frontend.sh (or `npm run build` in /frontend) at least once
# before starting Nginx, so public/index.html + assets/ exist.

server {
    listen 80;
    server_name your-domain.example;

    # backend/public is the ONE document root for both the SPA and the API.
    root /var/www/id-card-unit-app/backend/public;
    index index.php;

    client_max_body_size 50m;

    # Every timeout below has a 5-minute (300s) floor so slow capture-app
    # calls or large uploads aren't cut off mid-request.
    client_body_timeout 300s;
    client_header_timeout 300s;
    send_timeout 300s;
    keepalive_timeout 300s;

    charset utf-8;

    location / {
        # Laravel's own front controller handles the SPA fallback
        # (see routes/web.php), so everything not matching a real file
        # falls through to index.php.
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Match the app's own 5-minute HTTP client timeouts so PHP-FPM
        # doesn't kill a slow request before the app itself gives up.
        fastcgi_connect_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log /var/log/nginx/id-card-unit-error.log;
    access_log /var/log/nginx/id-card-unit-access.log;
}

# For HTTPS, terminate TLS here (or in a reverse proxy in front of Nginx)
# and set APP_URL in .env to the https:// address. Remember to also raise
# proxy_read_timeout/proxy_send_timeout to >= 300s on any reverse proxy
# sitting in front of this server block.
